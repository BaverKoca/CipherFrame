<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Cipher Frame login page. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cipher Frame login page.">
  <title>Cipher Frame | Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card hero-card">
      <div class="brand-mark">CF</div>
      <p class="eyebrow">Cipher Frame Secure Messaging</p>
      <h1>Login</h1>
      <p class="lede">Sign in to access encrypted image messaging, online users, and your secure inbox.</p>

      <form id="login-form" class="form-stack">
        <label>
          <span>Username</span>
          <input id="login-username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" aria-live="polite"></p>
        <button class="primary-action" type="submit">Login</button>
      </form>

      <div class="auth-links">
        <a href="/register.html">Create an account</a>
      </div>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
