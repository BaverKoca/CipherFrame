<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Cipher Frame registration page. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cipher Frame registration page.">
  <title>Cipher Frame | Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card hero-card">
      <div class="brand-mark">CF</div>
      <p class="eyebrow">Cipher Frame Secure Messaging</p>
      <h1>Register</h1>
      <p class="lede">Create a client account for encrypted image sharing and secure realtime chat.</p>

      <form id="register-form" class="form-stack">
        <label>
          <span>Username</span>
          <input id="register-username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>Email</span>
          <input id="register-email" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input id="register-password" type="password" autocomplete="new-password" required>
        </label>
        <label>
          <span>Confirm Password</span>
          <input id="register-confirm-password" type="password" autocomplete="new-password" required>
        </label>
        <p class="form-error" id="register-error" aria-live="polite"></p>
        <button class="primary-action" type="submit">Create Account</button>
      </form>

      <div class="auth-links">
        <a href="/login.html">Back to login</a>
      </div>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
